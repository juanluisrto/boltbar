name: Native macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native state, attachments, streaming and rendering
        run: swift test
      - name: Build universal macOS app
        env:
          BOLTBAR_UNIVERSAL: "1"
        run: sh scripts/build-native.sh
      - name: Package review artifact
        run: ditto -c -k --keepParent build/Boltbar.app build/Boltbar-native-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: boltbar-native-universal
          path: build/Boltbar-native-universal.zip
