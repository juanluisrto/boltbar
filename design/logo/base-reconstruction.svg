    <!-- Right piece: mirrored; long top arm with a downward tab, short bottom arm. -->
    <path d="M903 115 H1152 A287.5 287.5 0 0 1 1152 690 H862 L895 547 H1152 A144.5 144.5 0 0 0 1152 258 H990 L955 402 H942 V350 H848 Z"/>
  </g>
</svg>
