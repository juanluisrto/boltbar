[workspace]
resolver = "2"
members = ["crates/boltbar-core", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/juanluisrto/boltbar"
rust-version = "1.90"

[workspace.dependencies]
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# macOS 27 dyld rejects LINKEDIT alignment produced by stripping proc-macros.
# Keep host build tools loadable; the delivered executable remains stripped.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"
